<dialog class="modal wide" id="modal-package">
  <form class="stacked-form" method="post" action="{{ url_for('build.start', stage_key='package', config=config.id) }}"
        hx-post="{{ url_for('build.package_plan', config=config.id) }}" hx-trigger="plan, change" hx-target="#package-plan" hx-swap="innerHTML">
    <h3>Package {{ config.name }}</h3>
    <div class="field"><span class="field-title">Fixed tags <span class="hint">added to every package; they cannot be changed</span></span>
      <div class="tag-chips">{% for key, value in package_ui.fixed.items() %}<code class="tag-chip">{{ key }}={{ value }}</code>{% endfor %}</div></div>
    <fieldset><legend>What to package</legend>
      <div class="check-list">
        {% for c in package_ui.classes %}
        <label><input type="checkbox" name="classes" value="{{ c }}" checked><span><strong>{{ c }}</strong></span>
          <span class="hint">{{ package_ui.class_help[c] }}</span></label>
        {% endfor %}
      </div>
    </fieldset>
    <label class="field"><span>Extra labels <span class="hint">optional, one per line: <code>key=value</code> or a bare label</span></span>
      <textarea name="labels" rows="3" placeholder="candidate&#10;for=q4"></textarea></label>
    <label class="field"><span>Note <span class="hint">optional</span></span><input type="text" name="note" maxlength="500"></label>
    <div class="check-list">
      <label><input type="checkbox" name="verify" value="1" checked><span>Verify the package afterwards <span class="hint">reads every file again; needed before the cleanup</span></span></label>
      <label><input type="checkbox" name="force" value="1"><span>Package even when a stage is outdated, unreviewed or running</span></label>
    </div>
    <div id="package-plan" class="plan-panel"><p class="muted">Checking what would be packaged…</p></div>
    <div class="form-actions"><button type="button" onclick="this.closest('dialog').close()">Cancel</button></div>
  </form>
</dialog>
